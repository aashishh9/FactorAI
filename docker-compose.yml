services:
  db:
    image: postgres:17
    container_name: factorai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: factorai
      POSTGRES_PASSWORD: factorai_password
      POSTGRES_DB: factorai
    ports:
      - "5434:5432"
    volumes:
      - factorai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factorai -d factorai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: factorai-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://factorai:factorai_password@db:5432/factorai
      FACTORAI_SECRET_KEY: factorai-development-secret-key
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: factorai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  factorai_postgres_data:
